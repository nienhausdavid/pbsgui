[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbsgui"
version = "0.1.0"
description = "GUI für den Proxmox Backup Client"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
gui = ["PySide6"]
dev = ["pytest", "pytest-asyncio", "PySide6"]

[project.scripts]
pbsgui = "pbsgui.cli.main:main"
pbsgui-run = "pbsgui.cli.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
