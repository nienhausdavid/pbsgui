[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbsgui"
version = "0.8.0"
description = "GUI für den Proxmox Backup Client"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "David Nienhaus" }]
readme = "README.md"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
gui = ["PySide6"]
dev = ["pytest", "pytest-asyncio", "PySide6"]

[project.scripts]
pbsgui = "pbsgui.cli.main:main"
pbstui = "pbsgui.tui.app:run"
pbsgui-run = "pbsgui.cli.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
