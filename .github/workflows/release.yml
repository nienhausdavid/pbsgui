name: Release
# Bei einem Tag v* (z. B. v0.1.0): .deb bauen, als GitHub-Release veröffentlichen und das
# signierte APT-Repository auf GitHub Pages aktualisieren.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version aus Tag und pyproject prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          [ "$tag" = "$ver" ] || { echo "Tag $tag passt nicht zur Version $ver in pyproject.toml" >&2; exit 1; }
      - run: scripts/build-deb.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
      - name: Release-Notizen aus dem CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '/^## \[/{p=($0 ~ "^## \\[" v "\\]")} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md hat keinen Abschnitt für $ver" >&2; exit 1; }
          cat notes.md
      - name: GitHub-Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --title "pbsgui ${GITHUB_REF_NAME#v}" --notes-file notes.md

  iso:
    name: Rettungs-ISO bauen
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends live-build debootstrap debian-archive-keyring xorriso \
            squashfs-tools mtools dosfstools grub-pc-bin grub-efi-amd64-bin grub-common isolinux syslinux-utils curl
      - name: ISO bauen (xz-komprimiert)
        run: sudo env ISO_COMPRESSION=xz BUILD_DIR="$RUNNER_TEMP/iso" scripts/build-iso.sh "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: rescue-iso
          path: dist/pbsgui-rescue-*.iso*
      - name: An das GitHub-Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/pbsgui-rescue-*.iso dist/pbsgui-rescue-*.iso.sha256 --clobber

  apt-repo:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Signaturschlüssel vorhanden?
        id: key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "Secret APT_GPG_PRIVATE_KEY fehlt: APT-Repository wird übersprungen."; fi
      - name: Alle Release-.deb sammeln
        if: steps.key.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir debs
          for tag in $(gh release list --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern '*.deb' --dir debs --clobber
          done
          ls debs
      - name: Repository bauen und signieren
        if: steps.key.outputs.enabled == 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          export GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          scripts/build-apt-repo.sh debs site stable
          cp packaging/apt-index.html site/index.html
      - uses: actions/configure-pages@v5
        if: steps.key.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.enabled == 'true'
        with:
          path: site
      - id: deploy
        if: steps.key.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
