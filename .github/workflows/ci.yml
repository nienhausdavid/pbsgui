name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests und .deb-Build (Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten installieren (wie das .deb sie verlangt)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-pytest-asyncio python3-textual \
            python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets \
            openssl systemd libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 apt-utils
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python3 -m pytest -q
      - name: .deb bauen
        run: scripts/build-deb.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
