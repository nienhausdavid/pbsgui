name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests und .deb-Build (Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten installieren (wie das .deb sie verlangt)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-pytest python3-pytest-asyncio python3-textual \
            python3-pyside6.qtcore python3-pyside6.qtgui python3-pyside6.qtwidgets \
            openssl systemd libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 apt-utils
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python3 -m pytest -q
      - name: .deb bauen
        run: scripts/build-deb.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  security:
    name: Sicherheitsprüfungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Werkzeuge installieren
        run: pip install ruff bandit pip-audit
      - name: ruff (Fehler und Sicherheitsregeln)
        run: ruff check src
      - name: bandit (nur mittlere und hohe Befunde)
        run: bandit -c pyproject.toml -r src -ll
      - name: Abhängigkeiten auf bekannte Lücken prüfen
        run: |
          pip install textual PySide6
          pip-audit --skip-editable --desc
